<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shree Devi Jewellers | Gold, Silver, Diamond &amp; Gemstones</title>
<link rel="icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#3b0021;--plum2:#5a0a35;--wine:#7a1b45;--gold:#c8963e;--gold2:#e2b566;--cream:#fbf4ea;--peach:#fde5cf;--ink:#2a1420;--mut:#7d6a72;--h1:clamp(30px,5.2vw,50px);--h2:clamp(30px,5.2vw,50px);--h3:22px;--p:18px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Outfit,sans-serif;font-size:16px;color:var(--ink);background:var(--cream);line-height:1.7;overflow-x:hidden}
h1,h2,h3{font-family:Jost,sans-serif;font-weight:700}h4,.nav,.btn,.eyebrow{font-family:Jost,sans-serif}
h1{font-size:var(--h1);font-weight:700;line-height:1.2}h2{font-size:var(--h2);font-weight:700;line-height:1.2}h3{font-size:var(--h3);font-weight:700;line-height:1.3}p{font-size:var(--p)}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button,input,select,textarea{font:inherit}
section{padding:50px 0}.wrap{width:min(1240px,92%);margin:auto}
.eyebrow{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:500}
.head{text-align:center;margin-bottom:36px}.head h2{margin-top:6px;color:var(--plum)}
.head:after{content:"";display:block;width:90px;height:1px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border:1px solid var(--gold);background-color:var(--gold);color:var(--plum);font:600 13px/1 Jost,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:center;white-space:nowrap;cursor:pointer;transition:background-color .3s,color .3s,border-color .3s;position:relative}
.btn:hover{background-color:var(--plum);border-color:var(--plum);color:var(--gold2)}
.btn.d{background-color:var(--plum);border-color:var(--plum);color:var(--gold2)}.btn.d:hover{background-color:var(--gold);border-color:var(--gold);color:var(--plum)}
.dark .btn:hover,.fc .btn:hover,.cta .btn:hover,.sl .btn:hover,.ab-hero .btn:hover{background-color:var(--cream);border-color:var(--cream);color:var(--plum)}
/* header (GRT style: strip / logo+search+icons / centered nav with mega menu) */
.strip{background:var(--plum);color:var(--gold2);font:400 13px Jost,sans-serif;letter-spacing:.08em;text-align:center;padding:8px 10px}
header{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 2px 18px #3b002114}
.hr{display:flex;align-items:center;gap:30px;padding:12px 0}.logo img{height:62px}
.search{flex:1;max-width:560px;margin:auto;display:flex;border:1px solid #e6d5c0;overflow:hidden;background:var(--cream)}
.search input{flex:1;border:0;background:none;padding:11px 20px;outline:0;font-size:15px}.search button{border:0;background:var(--plum);color:var(--gold2);padding:0 22px;cursor:pointer}
.ic{display:flex;gap:22px;align-items:center}.ic a{display:flex;flex-direction:column;align-items:center;font:400 11px Jost,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--plum);cursor:pointer;position:relative;transition:.3s}.ic a:hover{color:var(--gold)}.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.ic b{position:absolute;top:-6px;right:-2px;background:var(--gold);color:var(--plum);font-size:10px;width:16px;height:16px;text-align:center;line-height:16px}
.nav{border-top:1px solid #f0e4d3;background:#fff}.nav ul{list-style:none;display:flex;justify-content:center;gap:6px}.nav li{position:static}
.nav>div>ul>li>a{display:block;padding:14px 20px;font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--plum);position:relative}
.nav>div>ul>li>a:after{content:"";position:absolute;left:20px;right:20px;bottom:8px;height:2px;background:var(--gold);transform:scaleX(0);transition:.35s}.nav li:hover>a:after{transform:scaleX(1)}
.mega{position:absolute;left:0;right:0;top:100%;background:#fff;border-top:2px solid var(--gold);box-shadow:0 20px 40px #3b002122;opacity:0;visibility:hidden;transform:translateY(12px);transition:.35s;padding:28px 0}
.nav li:hover .mega{opacity:1;visibility:visible;transform:none}.mega .wrap{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:24px}
.mega h4{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}.mega a{display:block;padding:4px 0;color:var(--ink);font-size:15px;transition:.3s}.mega a:hover{color:var(--wine);padding-left:8px}.mega img{height:170px;width:100%;object-fit:cover}
.burger{display:none;background:none;border:0;font-size:26px;color:var(--plum);cursor:pointer}.navwrap{position:relative}
/* hero */
.hero{padding:0;position:relative;height:min(78vh,700px);background:var(--plum);overflow:hidden}
.sl{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(110deg,var(--plum) 0 45%,var(--plum2))}.sl.on{opacity:1;z-index:2}
.sl .tx{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:0 6% 0 8%;color:var(--cream)}.sl h1{color:var(--cream)}.sl h1 em{color:var(--gold2);font-style:normal}.sl p{color:#e9d7c4;max-width:460px;font-weight:300}
.sl .im{position:relative;overflow:hidden;clip-path:ellipse(100% 120% at 100% 50%)}.sl .im img{width:100%;height:100%;object-fit:cover;transform:scale(1.15);transition:transform 7s}.sl.on .im img{transform:scale(1)}
.sl .tx>*{opacity:0;transform:translateY(26px);transition:.9s}.sl.on .tx>*{opacity:1;transform:none}.sl.on .tx>*:nth-child(2){transition-delay:.2s}.sl.on .tx>*:nth-child(3){transition-delay:.4s}.sl.on .tx>*:nth-child(4){transition-delay:.6s}
.dots{position:absolute;bottom:22px;left:8%;z-index:5;display:flex;gap:10px}.dots i{width:34px;height:3px;background:#ffffff55;cursor:pointer}.dots i.on{background:var(--gold2)}
/* trust */
.trust{background:linear-gradient(90deg,var(--plum),var(--wine),var(--plum));color:var(--cream);padding:30px 0}.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}.trust b{display:block;font:500 17px Jost,sans-serif;color:var(--gold2);letter-spacing:.06em}.trust span{font-size:14px;color:#ddc7bd}
/* cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.cat{position:relative;overflow:hidden;aspect-ratio:3/4;display:block;background:var(--plum)}.cat img{width:100%;height:100%;object-fit:cover;transition:1.2s}.cat:hover img{transform:scale(1.12)}
.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#3b0021ee)}.cat div{position:absolute;bottom:22px;left:0;right:0;text-align:center;z-index:2;color:var(--cream)}.cat h3{letter-spacing:.1em;text-transform:uppercase}.cat span{color:var(--gold2);font-size:13px}
.cat:before{content:"";position:absolute;inset:12px;border:1px solid #e2b56688;z-index:3;transition:.5s;opacity:0}.cat:hover:before{opacity:1;inset:18px}
.pc{background:#fff;position:relative;transition:.5s;border:1px solid #f1e3d1}.pc:hover{transform:translateY(-8px);box-shadow:0 24px 40px #3b002120}
.pc .ph{aspect-ratio:4/5;overflow:hidden;position:relative;background:var(--peach)}.pc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.7s}.pc .ph img+img{opacity:0}.pc:hover .ph img+img{opacity:1}.pc:hover .ph img{transform:scale(1.06)}
.pc .in{padding:16px;text-align:center}.pc h3{font-size:17px;color:var(--plum)}.pc small{color:var(--mut);display:block}.pc .pr{font:500 18px Jost,sans-serif;color:var(--wine);margin:4px 0 10px}
.tag{position:absolute;top:12px;left:12px;background:var(--plum);color:var(--gold2);font:500 11px Jost,sans-serif;letter-spacing:.14em;padding:4px 10px;z-index:2;text-transform:uppercase}
.heart{position:absolute;top:10px;right:10px;z-index:3;background:#fff;border:0;width:34px;height:34px;cursor:pointer;color:var(--wine);font-size:17px}
/* bands */
.dark{background:radial-gradient(circle at 20% 0,var(--plum2),var(--plum) 60%);color:var(--cream)}.dark .head h2{color:var(--cream)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.split img{width:100%;height:480px;object-fit:cover;border:1px solid var(--gold);outline:1px solid #c8963e66;outline-offset:12px}.split p{margin:14px 0;color:#e7d6c8;font-weight:300}
.peach{background:linear-gradient(180deg,var(--peach),var(--cream))}.mv{display:grid;grid-template-columns:1fr 1fr;gap:30px}.mv div{padding:34px;background:#fff;border-top:3px solid var(--gold)}.mv h3{color:var(--plum);font-size:26px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.three div{background:#fff;padding:30px;border:1px solid #efdcc6;transition:.4s}.three div:hover{background:var(--plum);color:var(--cream);transform:translateY(-6px)}.three div:hover h3{color:var(--gold2)}.three h3{color:var(--plum);margin-bottom:8px;font-size:22px}
.quote{text-align:center;font:300 italic clamp(22px,3vw,34px)/1.5 Jost,sans-serif;color:var(--cream)}.quote em{color:var(--gold2)}
.rev{opacity:0;transform:translateY(40px);transition:1s}.rev.in{opacity:1;transform:none}
/* shop & product */
.pg{padding:50px 0 0;background:linear-gradient(120deg,var(--plum),var(--wine));color:var(--cream);text-align:center}.pg h1{font-size:var(--h2);padding-bottom:6px}.pg{padding-bottom:50px}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:26px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 18px;border:1px solid var(--gold);background:none;cursor:pointer;font:400 14px Jost,sans-serif;letter-spacing:.08em;color:var(--plum);transition:.3s}.chip.on,.chip:hover{background:var(--plum);color:var(--gold2)}
select,input,textarea{border:1px solid #dcc9b3;padding:10px 14px;background:#fff;width:100%;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--gold)}.tools select{width:auto}
.pd{display:grid;grid-template-columns:1.15fr 1fr;gap:50px}.gal{display:grid;grid-template-columns:88px 1fr;gap:14px;position:sticky;top:150px;align-self:start}.th{display:flex;flex-direction:column;gap:10px}.th img{aspect-ratio:1;object-fit:cover;cursor:pointer;border:2px solid transparent;opacity:.6;transition:.3s}.th img.on,.th img:hover{border-color:var(--gold);opacity:1}
.main{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--peach);cursor:zoom-in;border:1px solid #ecd9c2}.main img{width:100%;height:100%;object-fit:cover;transition:transform .15s;transform-origin:var(--x,50%) var(--y,50%)}.main:hover img{transform:scale(2.2)}.main .tag{z-index:3}
.pd h1{font-size:var(--h2);color:var(--plum)}.pd .pr{font:500 30px Jost,sans-serif;color:var(--wine);margin:10px 0}.spec{width:100%;border-collapse:collapse;margin:20px 0}.spec td{padding:10px 0;border-bottom:1px dashed #d9c3a8}.spec td:first-child{color:var(--mut);width:40%}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}
/* footer */
footer{background:var(--plum);color:#d9c3bb;padding:50px 0 0}footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:36px}footer img{height:90px;margin-bottom:12px}footer h4{color:var(--gold2);letter-spacing:.2em;font-size:14px;text-transform:uppercase;margin-bottom:12px}footer a{display:block;padding:3px 0;transition:.3s}footer a:hover{color:var(--gold2);padding-left:6px}.cp{text-align:center;padding:18px;margin-top:40px;border-top:1px solid #ffffff22;font-size:14px}
.ct{display:grid;grid-template-columns:1fr 1.2fr;gap:40px}.ct .box{background:#fff;padding:34px;border-top:3px solid var(--gold)}.ct p{margin:10px 0}.ct form{display:grid;gap:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--plum);color:var(--gold2);padding:12px 28px;z-index:99;border:1px solid var(--gold)}


/* v2 */
.strip{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:7px 4%;text-align:left}
.rt{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(90deg,#c8963e22,#e2b56633,#c8963e22);border:1px solid #c8963e66;padding:3px 18px;margin-left:auto;background-size:200%;animation:shm 6s linear infinite}
.rt b{font-weight:500;color:#fff;letter-spacing:.14em;text-transform:uppercase;font-size:12px;display:flex;align-items:center;gap:8px}.rt b i{width:7px;height:7px;background:#e2b566;animation:pls 1.8s infinite}
.rt em{font:500 15px Jost,sans-serif;font-style:normal;background:linear-gradient(90deg,#e2b566,#fff3d1,#e2b566);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shm 4s linear infinite}.rt small{font-size:11px;opacity:.7}.rt u{text-decoration:none;font-size:11px;opacity:.7}
@keyframes shm{to{background-position:200% 0}}@keyframes pls{50%{box-shadow:0 0 0 6px #e2b56633;opacity:.5}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}@keyframes kb{to{transform:scale(1.12)}}
/* hero */
.hero{height:min(82vh,720px)}.sl{display:block;background:var(--plum)}.sl .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1);transition:none}.sl.on .bg{animation:kb 9s ease-out forwards}
.sl:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#2a0016f2 0,#3b0021cc 30%,#3b002166 52%,transparent 72%)}
.sl .tx{position:relative;z-index:2;height:100%;max-width:640px;margin-left:max(6%,calc((100% - 1240px)/2));padding:0}.sl .tx>div{margin-top:6px}.sl h1{text-shadow:0 2px 24px #0008}.sl p{color:#f3e6da;font-size:18px}
.sk{position:absolute;z-index:4;width:14px;height:14px;background:radial-gradient(#fff,#e2b566 40%,transparent 70%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 3.2s infinite}
.cnt{position:absolute;right:6%;bottom:28px;z-index:5;color:var(--gold2);font:400 14px Jost,sans-serif;display:flex;align-items:center;gap:12px;letter-spacing:.2em}.cnt b{font:300 34px Jost,sans-serif;color:#fff}.cnt span{width:48px;height:1px;background:var(--gold2)}.dots{left:max(6%,calc((100% - 1240px)/2))}
/* trust icons */
.tr{background:radial-gradient(circle at 50% 0,#7a1b45,var(--plum) 70%);position:relative;overflow:hidden}.tr:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#c8963e0a 0 1px,transparent 1px 22px)}
.trg{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;position:relative}.tc{position:relative;padding:34px 18px 26px;text-align:center;border:1px solid #c8963e44;background:linear-gradient(160deg,#ffffff12,#ffffff04);backdrop-filter:blur(4px);overflow:hidden;transition:.5s;color:var(--cream)}
.tc:before,.tc:after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold);transition:.5s;pointer-events:none}.tc:before{top:12px;left:12px;border-right:0;border-bottom:0}.tc:after{bottom:12px;right:12px;border-left:0;border-top:0}.tc:hover:before,.tc:hover:after{width:calc(100% - 24px);height:calc(100% - 24px);border-color:#c8963e55}
.tc:hover{transform:translateY(-8px);box-shadow:0 20px 40px #0006;background:linear-gradient(160deg,#c8963e30,#ffffff06)}.tc em{position:absolute;right:12px;top:-6px;font:600 80px Jost,sans-serif;color:#ffffff0c;font-style:normal;line-height:1}
.ib{width:92px;height:92px;margin:0 auto 14px;position:relative}.ib svg{width:100%;height:100%;fill:none;stroke:var(--gold2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible}.halo{stroke-width:1!important;stroke-dasharray:2 6;transform-origin:32px 32px;animation:spin 16s linear infinite;stroke:#e2b56699}
.dr{stroke-dasharray:220;stroke-dashoffset:220}.rev.in .dr{animation:draw 2.2s .3s ease forwards}.sp{stroke:#fff;animation:tw 2.4s infinite;transform-origin:50px 14px}.tc:hover .ib svg{animation:flt .9s ease}@keyframes flt{40%{transform:translateY(-8px) rotate(-6deg) scale(1.08)}}
.tc h3{font-size:19px;letter-spacing:.08em;color:var(--gold2)}.tc span{font-size:14px;color:#ddc7bd}
/* about modern */
.mc1{display:grid;grid-template-columns:.9fr 2.1fr;gap:40px;align-items:center}.mc1 .l p{margin:14px 0 22px;color:#e7d6c8;font-weight:300}.mc1 h2{margin:6px 0}
.lk{font:500 13px Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);border-bottom:1px solid var(--gold);padding-bottom:4px}.lk{transition:color .3s,border-color .3s}.lk:hover{color:#fff;border-color:#fff}
.mcs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.mci{display:block;position:relative;aspect-ratio:3/4;overflow:hidden;background:#000;border:1px solid #c8963e55}.mci img{width:100%;height:100%;object-fit:cover;transition:1s;opacity:.92}.mci:hover img{transform:scale(1.1)}.mci span{position:absolute;left:0;right:0;bottom:0;padding:50px 16px 14px;background:linear-gradient(transparent,#1d000fee);display:block}.mci b{display:block;font:500 16px Jost,sans-serif;letter-spacing:.06em}.mci small{color:var(--gold2)}
.cr{background:var(--cream)}.mc2{display:grid;grid-template-columns:1.5fr 1fr .8fr;gap:30px;align-items:stretch}.mc2 .big{position:relative;min-height:380px;overflow:hidden;color:#fff;background:var(--plum)}.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transition:1.2s}.big:hover img{transform:scale(1.07)}.big:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#1d000fdd,transparent 70%)}.big div{position:absolute;left:28px;bottom:28px;z-index:2}.big h3{font:700 30px/1.25 Jost,sans-serif;margin:6px 0 10px}.big small{color:var(--gold2);letter-spacing:.14em;text-transform:uppercase}
.mc2 .mid{align-self:center}.mid h2{margin:6px 0 12px;color:var(--plum);font-size:30px}.mid p{margin-bottom:20px;color:#5a4650}
.sd{display:grid;gap:18px}.sd a{position:relative;overflow:hidden;min-height:170px;background:#fff;border:1px solid #ecd9c2}.sd img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:.8s}.sd a:hover img{transform:scale(1.1)}.sd span{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 10px;background:linear-gradient(transparent,#2a0016ee);color:#fff;font:500 16px Jost,sans-serif}.sd small{display:block;color:var(--gold2);font-size:12px}
/* offers */
.fc{background:radial-gradient(circle at 80% 0,#4a0d2e,#240014 70%);color:var(--cream)}.fc .head h2{color:#fff}.fcg{display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:1fr 1fr;gap:22px}.fb{grid-row:span 2}
.fb,.fs{position:relative;overflow:hidden;min-height:260px;border:1px solid #c8963e44}.fb{min-height:660px}.fb img,.fs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:1.4s}.fb:hover img,.fs:hover img{transform:scale(1.08)}
.fb:after,.fs:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#1d000fee,#1d000f55 60%,transparent)}.fb>div,.fs>div{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:26px}.fb h3,.fs h3{font:700 28px/1.25 Jost,sans-serif;margin:8px 0}.fb p,.fs p{color:#e7d6c8;font-size:15px;max-width:520px;margin-bottom:14px}.fs p{font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bd{display:inline-grid;place-items:center;min-width:46px;height:46px;padding:0 6px;border:1px solid var(--gold);background:#3b0021cc;color:var(--gold2);font:500 13px Jost,sans-serif;font-style:normal;transition:.6s}.fb:hover .bd,.fs:hover .bd{transform:rotate(360deg);background:var(--gold);color:var(--plum)}
/* video */
.vid{background:linear-gradient(180deg,var(--cream),var(--peach))}.vg{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.vc{position:relative;aspect-ratio:9/16;overflow:hidden;background:#000;border:1px solid var(--gold);box-shadow:0 18px 36px #3b002133;transition:.5s}.vc:hover{transform:translateY(-8px)}.vc video{width:100%;height:100%;object-fit:cover}
.vc:before{content:"";position:absolute;inset:8px;border:1px solid #e2b56677;z-index:2;pointer-events:none}.vc:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,#1d000fcc);pointer-events:none}.cap{position:absolute;left:18px;bottom:16px;z-index:3;color:#fff;font:500 16px Jost,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.snd{position:absolute;right:14px;top:14px;z-index:4;width:36px;height:36px;border:1px solid var(--gold);background:#3b0021aa;color:#fff;cursor:pointer}
/* product zoom */
.main{cursor:crosshair}.main img{transform:none!important;transition:none}.main:hover img{transform:none!important}
.lens{position:absolute;width:220px;height:220px;pointer-events:none;opacity:0;transition:opacity .25s;border:3px solid #fff;outline:1px solid var(--gold);box-shadow:0 18px 40px #3b002177,0 0 0 8px #ffffff55;background-repeat:no-repeat;z-index:4}
.exp{position:absolute;right:12px;bottom:12px;z-index:3;background:#3b0021cc;color:var(--gold2);font:500 12px Jost,sans-serif;letter-spacing:.14em;padding:6px 12px;text-transform:uppercase}
#lbx{position:fixed;inset:0;z-index:200;background:radial-gradient(circle,#4a0d2efa,#14000afc);opacity:0;visibility:hidden;transition:.45s}#lbx.on{opacity:1;visibility:visible}
.lbf{position:absolute;inset:24px;border:1px solid var(--gold);outline:1px solid #c8963e55;outline-offset:8px;display:flex;flex-direction:column;align-items:center;color:#fff;padding:14px}.lt{text-align:center}.lt small{display:block;font:500 12px Jost,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--gold2)}.lt b{font:700 22px Jost,sans-serif;letter-spacing:.04em}
.lst{flex:1;width:100%;overflow:hidden;display:grid;place-items:center;touch-action:none;min-height:0}.lst img{max-height:calc(100vh - 250px);max-width:100%;object-fit:contain;transition:transform .15s;user-select:none;box-shadow:0 30px 80px #000a}
.lx{position:absolute;right:14px;top:8px;background:none;border:0;color:var(--gold2);font-size:38px;cursor:pointer;z-index:3;transition:.4s}.lx:hover{transform:rotate(90deg)}
.ar{position:absolute;top:50%;background:#3b0021aa;border:1px solid var(--gold);color:var(--gold2);width:48px;height:48px;font-size:28px;cursor:pointer;z-index:3}.ar.l{left:14px}.ar.r{right:14px}
.lc{display:flex;gap:10px;align-items:center;margin:10px 0;font:400 14px Jost,sans-serif;color:var(--gold2)}.lc button{background:none;border:1px solid var(--gold);color:var(--gold2);padding:5px 14px;cursor:pointer;font:500 14px Jost,sans-serif}.lc button:hover{background:var(--gold);color:var(--plum)}.lth{display:flex;gap:8px}.lth img{width:54px;height:54px;object-fit:cover;opacity:.5;border:1px solid transparent;cursor:pointer}.lth img.on{opacity:1;border-color:var(--gold)}
@media(max-width:1000px){.mc1,.mc2{grid-template-columns:1fr}.sd{grid-template-columns:1fr 1fr}.vg{grid-template-columns:1fr 1fr}.trg{grid-template-columns:1fr 1fr}.fcg{grid-template-columns:1fr}.fb{grid-row:auto;min-height:420px}.sl:before{background:linear-gradient(90deg,#2a0016ee,#3b002199)}.strip{flex-direction:column;gap:4px;padding:6px 3%}.sa{display:none}.rt{margin:auto;gap:12px;justify-content:center}.lens{display:none}.hero{height:min(78vh,620px)}.sl .tx{margin-left:6%;max-width:88%}}
@media(max-width:760px){.mcs{grid-template-columns:1fr 1fr 1fr;gap:8px}.mci b{font-size:12px}.mci small{display:none}.vg{gap:10px}.trg{gap:12px}.tc{padding:26px 10px 18px}.ib{width:70px;height:70px}.tc h3{font-size:16px}.rt b{display:none}.cnt{display:none}.lbf{inset:8px;padding:8px}.sl h1{font-size:34px}}
/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh;background:#f6efe6}.side{background:var(--plum);padding:24px 16px;color:#fff}.side img{height:70px;margin:0 auto 22px}.side a{display:block;padding:11px 14px;cursor:pointer;color:#e7d6c8;border-left:3px solid transparent;font-family:Jost,sans-serif}.side a.on,.side a:hover{background:#ffffff14;border-color:var(--gold);color:var(--gold2)}
.am{padding:28px;overflow:auto}.am h2{font-size:28px;color:var(--plum);margin-bottom:18px}.tb{width:100%;border-collapse:collapse;background:#fff}.tb th,.tb td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.tb th{background:var(--plum);color:var(--gold2);font-family:Jost,sans-serif;font-weight:500}.tb img{width:48px;height:48px;object-fit:cover}
.fm{background:#fff;padding:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px}.fm .f{grid-column:1/-1}.fm label{font:500 13px Jost,sans-serif;letter-spacing:.08em;color:var(--mut);display:block;margin-bottom:3px}.imgs{display:flex;gap:8px;flex-wrap:wrap}.imgs div{position:relative}.imgs img{width:76px;height:76px;object-fit:cover}.imgs b{position:absolute;top:-6px;right:-6px;background:#b3261e;color:#fff;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer;font-size:12px}
.sm{padding:6px 12px;font-size:12px;margin-right:4px}.lg{max-width:380px;margin:12vh auto;background:#fff;padding:36px;text-align:center;display:grid;gap:14px;border-top:3px solid var(--gold)}.lg img{height:90px;margin:auto}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.pd,.split,.ct{grid-template-columns:1fr}.gal{position:static}.sl{grid-template-columns:1fr}.sl .im{position:absolute;inset:0;opacity:.28;clip-path:none}.sl .tx{position:relative;z-index:2;padding:0 7%}footer .wrap{grid-template-columns:1fr 1fr}.search{display:none}.mega .wrap{grid-template-columns:repeat(2,1fr)}.adm{grid-template-columns:1fr}.side{display:flex;flex-wrap:wrap;gap:4px}.side img{display:none}}
@media(max-width:760px){.burger{display:block}.hr{gap:10px}.logo img{height:50px}.ic{margin-left:auto;gap:14px}.ic span{display:none}.navwrap{display:none}.navwrap.open{display:block}.nav ul{flex-direction:column;gap:0}.mega{display:none}.trust .wrap,.three,.mv{grid-template-columns:1fr 1fr}.three,.mv{grid-template-columns:1fr}.gal{grid-template-columns:1fr}.th{flex-direction:row;order:2}.th img{width:64px}.fm{grid-template-columns:1fr}.hero{height:auto;min-height:540px}footer .wrap{grid-template-columns:1fr}.split img{height:320px}.grid{gap:12px}}

/* ================= v3 ================= */
@keyframes icoShine{0%{background-position:130% 0}60%,100%{background-position:-130% 0}}
@keyframes icoFloat{0%,100%{transform:translateY(2px)}50%{transform:translateY(-4px)}}
@keyframes pwv{0%{transform:scale(.88);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes tcIn{from{opacity:0;transform:translateY(46px) scale(.96)}}
@keyframes drift{from{background-position:0 0,0 0,0 0}to{background-position:60px -140px,-80px -200px,40px -120px}}
@keyframes grSw{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
.grt.sw{animation:grSw .5s ease}
@keyframes tickF{0%{color:#c8963e;transform:scale(1.18)}100%{color:inherit;transform:none}}
@keyframes coinF{0%,72%,100%{transform:perspective(160px) rotateY(0)}86%{transform:perspective(160px) rotateY(180deg)}}
@keyframes sgIn{from{opacity:0;transform:translateY(8px)}}
@keyframes lvp{50%{box-shadow:0 0 0 5px #2fb36633}}

/* ---- header row 1 : gold rate selector ---- */
.strip{position:relative;z-index:55;display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:50px;padding:5px 4%;background:linear-gradient(90deg,#fbf4ea,#fffaf3 50%,#fbf4ea);border-bottom:1px solid #efdfc8;color:var(--plum);text-align:left}
.strip .sa{font:400 12.5px Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8a5a14}
.gr{position:relative;margin-left:auto}
.grb{display:flex;align-items:center;gap:11px;background:none;border:0;cursor:pointer;padding:5px 12px 5px 8px;color:var(--plum);font:500 16.5px Jost,sans-serif;letter-spacing:.01em;transition:background .3s}
.grb:hover,.gr.open .grb{background:#3b00210d}
.grb .coin{width:34px;height:27px;flex:none;filter:drop-shadow(0 2px 3px #6b341055);animation:coinF 7s ease-in-out infinite}
.grb .chv{width:18px;height:18px;stroke:var(--wine);fill:none;stroke-width:2.2;transition:transform .35s}
.gr.open .chv{transform:rotate(180deg)}
.grt{white-space:nowrap}.grt b{font-weight:600;display:inline-block}.grt b.tick{animation:tickF 1.3s}
.grm{position:absolute;right:0;top:calc(100% + 8px);min-width:300px;list-style:none;background:#fff;border:1px solid #e6d5c0;border-top:2px solid var(--gold);box-shadow:0 22px 44px #3b002128;padding:6px 0;opacity:0;visibility:hidden;transform:translateY(8px);transition:.3s;z-index:60}
.gr.open .grm{opacity:1;visibility:visible;transform:none}
.grm li{display:flex;justify-content:space-between;gap:24px;padding:11px 20px;font:500 14px Jost,sans-serif;letter-spacing:.05em;color:var(--plum);cursor:pointer;transition:.2s}
.grm li[hidden]{display:none}
.grm li:hover{background:var(--cream)}.grm li.on{background:#fdf1de}.grm li.on span:before{content:"✓  ";color:var(--gold)}
.grm li.gs{cursor:default;justify-content:flex-start;align-items:center;gap:8px;font:400 12px Jost,sans-serif;letter-spacing:.04em;color:var(--mut);border-top:1px solid #f0e4d3;margin-top:4px;background:none}
.lv{width:8px;height:8px;background:#2fb366;animation:lvp 1.8s infinite}

/* ---- live search ---- */
.sbox{position:relative;flex:1;max-width:560px;margin:auto}
.sbox .search{max-width:none;margin:0;width:100%;transition:border-color .3s,box-shadow .3s}
.sbox .search:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px #c8963e22}
.sg{position:absolute;left:0;right:0;top:calc(100% + 10px);background:#fff;border:1px solid #e6d5c0;border-top:2px solid var(--gold);box-shadow:0 26px 50px #3b002133;z-index:70;max-height:min(70vh,470px);overflow:auto;opacity:0;visibility:hidden;transform:translateY(8px);transition:.25s}
.sg.on{opacity:1;visibility:visible;transform:none}
.sg.on .sgi{animation:sgIn .35s backwards}.sg.on .sgi:nth-child(2){animation-delay:.04s}.sg.on .sgi:nth-child(3){animation-delay:.08s}.sg.on .sgi:nth-child(4){animation-delay:.12s}.sg.on .sgi:nth-child(5){animation-delay:.16s}.sg.on .sgi:nth-child(6){animation-delay:.2s}
.sgi{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid #f6ece0;transition:background .2s,padding .25s}
.sgi:hover,.sgi.act{background:var(--cream);padding-left:22px}
.sgi img{width:48px;height:48px;object-fit:cover;border:1px solid #ecd9c2;flex:none}
.sgi span{flex:1;min-width:0}.sgi b{display:block;font:500 15px Jost,sans-serif;color:var(--plum);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sgi small{color:var(--mut);font-size:12.5px}
.sgi mark{background:none;color:#b07a22;font-weight:600}.sgi em{font:500 14px Jost,sans-serif;font-style:normal;color:var(--wine)}
.sga{justify-content:center;border-bottom:0;font:500 12px Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9a6a1c;padding:13px}
.sgn{padding:20px;text-align:center;color:var(--mut)}
.search input::placeholder{color:#8a7480;opacity:1}

/* ---- hero dots ---- */
.dots i{background:#fffc;box-shadow:0 0 0 1px #3b002133}.dots i.on{background:var(--gold2);box-shadow:0 0 0 1px #3b002166}
.sl .bt{display:flex;gap:14px;flex-wrap:wrap}

/* ---- icon / promise section ---- */
.tr{padding:62px 0 66px;background:radial-gradient(ellipse at 50% -10%,#8a2150 0,#5a0a35 38%,#35001e 80%)}
.tr:before{background:repeating-linear-gradient(45deg,#c8963e0c 0 1px,transparent 1px 22px)}
.tr:after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,#e2b566,transparent)}
.tp{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#e2b566cc,transparent),radial-gradient(1.5px 1.5px at 90px 120px,#fff8,transparent),radial-gradient(2px 2px at 150px 60px,#e2b56688,transparent);background-size:180px 200px,240px 260px,300px 220px;animation:drift 26s linear infinite;opacity:.55}
.trh{text-align:center;margin-bottom:38px;position:relative}
.trh .eyebrow{display:inline-flex;align-items:center;gap:16px;color:var(--gold2)}
.trh .eyebrow:before,.trh .eyebrow:after{content:"";width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2))}.trh .eyebrow:after{transform:scaleX(-1)}
.trg{gap:24px}
.tc{padding:38px 18px 30px;background:linear-gradient(115deg,transparent 42%,#ffffff22 50%,transparent 58%) no-repeat -160% 0/260% 100%,linear-gradient(160deg,#ffffff14,#ffffff05);border:1px solid #c8963e55;transition:transform .6s,box-shadow .6s,border-color .5s,background-position 1.1s,opacity 1s}
.tc.rev.in{animation:tcIn 1s calc(var(--i,0)*.14s) backwards}
.tc:hover{transform:translateY(-10px);background:linear-gradient(115deg,transparent 42%,#ffffff2e 50%,transparent 58%) no-repeat 160% 0/260% 100%,linear-gradient(160deg,#c8963e33,#ffffff08);border-color:#e2b566;box-shadow:0 26px 50px #0007,0 0 0 1px #e2b56633}
.tc em{color:transparent;-webkit-text-stroke:1px #e2b56638;font-size:84px;right:14px;top:-4px}
.tc h3{font-size:19px;letter-spacing:.1em;margin-top:2px;text-transform:uppercase;font-weight:500}
.tc .sub{display:block;font-size:14px;color:#e8d3c8;margin-top:2px}
.tc .bar{display:block;width:44px;height:2px;margin:16px auto 0;background:linear-gradient(90deg,transparent,#e2b566,transparent);transition:width .6s}.tc:hover .bar{width:110px}
.ib{width:116px;height:116px;margin:0 auto 20px;display:grid;place-items:center;position:relative}
.ib:before{content:"";position:absolute;inset:11px;background:radial-gradient(circle at 34% 28%,#8c2552,#3b0021 72%);box-shadow:inset 0 0 20px #000a,0 0 0 1px #e2b56655,0 12px 26px #0008;transition:.5s}
.tc:hover .ib:before{box-shadow:inset 0 0 20px #000a,0 0 0 1px #e2b566,0 0 34px #e2b56666,0 12px 26px #0008}
.ib i{position:absolute;display:block}
.ib .rg{inset:4px;background:conic-gradient(from 0deg,transparent 0 52%,#c8963e 74%,#fff3d1 92%,transparent);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));animation:spin 5.5s linear infinite}
.tc:hover .ib .rg{animation-duration:1.8s}
.ib .dh{inset:-9px;border:1px dashed #e2b56699;animation:spin 20s linear infinite reverse}
.ib .dh:after{content:"";position:absolute;top:-3.5px;left:50%;width:7px;height:7px;margin-left:-3.5px;background:#fff3d1;box-shadow:0 0 12px 3px #e2b566}
.ib .pw{inset:10px;border:1px solid #e2b566;opacity:0;animation:pwv 3.4s ease-out infinite}.ib .p2{animation-delay:1.7s}
.ib .ico{inset:30px;background:linear-gradient(115deg,#b27a22 0%,#e2b566 28%,#fff6dc 46%,#e2b566 62%,#b27a22 100%);background-size:260% 100%;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;animation:icoShine 3.8s ease-in-out infinite,icoFloat 4.6s ease-in-out infinite;filter:drop-shadow(0 0 6px #e2b56655);transition:filter .5s,scale .5s}
.tc:hover .ib .ico{scale:1.14;filter:drop-shadow(0 0 12px #e2b566aa)}
.tc:nth-child(2) .ib .ico{animation-delay:.5s,.4s}.tc:nth-child(3) .ib .ico{animation-delay:1s,.8s}.tc:nth-child(4) .ib .ico{animation-delay:1.5s,1.2s}
.ib .st{position:absolute;width:13px;height:13px;background:radial-gradient(#fff,#e2b566 42%,transparent 70%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 2.8s infinite}
.ib .st.a{top:6px;right:8px}.ib .st.b{bottom:10px;left:4px;animation-delay:1.4s;width:10px;height:10px}

/* ---- jewellery categories : single-line headings, description on hover ---- */
.cat{container-type:inline-size}
.cat div{padding:0;bottom:24px}
.cat h3{white-space:nowrap;font-size:clamp(11px,5cqw,17px);letter-spacing:.08em;position:relative;display:inline-block;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;vertical-align:top;padding-bottom:8px}
.cat h3:after{content:"";position:absolute;left:50%;bottom:0;width:28px;height:1px;background:var(--gold2);transform:translateX(-50%);transition:width .6s cubic-bezier(.2,.8,.2,1)}

function rs(file,max=900){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(file)})}
